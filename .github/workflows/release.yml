name: Release

# Triggered when a versioned release tag is pushed.
# The developer creates and pushes the tag locally:
#   git tag published-v1.0.0
#   git push origin published-v1.0.0
# This workflow then:
#   1. Builds dcs-serve.exe and dcs-client.exe (PyInstaller, Windows)
#   2. Creates the GitHub Release and uploads assets (using committed RELEASE_NOTES.md)
#   3. Moves the published-latest floating tag

on:
  push:
    tags:
      - "published-v*"

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest  # required: PyInstaller must produce Windows .exe

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. published-v1.0.0
          VERSION="${TAG#published-v}"      # e.g. 1.0.0
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies (including PyInstaller)
        run: poetry install --with build

      - name: Lint (ruff)
        run: poetry run ruff check src/

      - name: Type check (mypy)
        run: poetry run mypy src/

      - name: Tests (pytest)
        run: poetry run pytest

      - name: Build executables
        run: |
          poetry run pyinstaller dcs-serve.spec
          poetry run pyinstaller dcs-client.spec

      - name: Smoke-test dcs-serve.exe (must actually listen)
        shell: pwsh
        working-directory: dist
        run: |
          # Guards the packaging defect where the frozen script never calls main():
          # the exe would exit 0 immediately, listening on nothing. No config file is
          # needed — dcs-serve generates dcs-serve.yaml with defaults on first run.
          function Test-Port([int]$Port) {
            $client = New-Object System.Net.Sockets.TcpClient
            try { $client.Connect('127.0.0.1', $Port); return $true }
            catch { return $false }
            finally { $client.Dispose() }
          }

          # Without this, a listener left over from anything else would make the check
          # pass while proving nothing about the exe we just built.
          foreach ($p in 7777, 8080) {
            if (Test-Port $p) { throw "Port $p is already in use before the test — the result would be meaningless." }
          }

          $proc = Start-Process -FilePath .\dcs-serve.exe -PassThru `
                    -RedirectStandardOutput serve-out.log -RedirectStandardError serve-err.log
          try {
            # Both ports are bound concurrently (asyncio.gather), so poll for both
            # rather than assuming an order.
            $deadline = (Get-Date).AddSeconds(30)
            $listening = $false
            while ((Get-Date) -lt $deadline) {
              if ((Test-Port 7777) -and (Test-Port 8080)) { $listening = $true; break }
              if ($proc.HasExited) { break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $listening) {
              Write-Host '--- stdout ---'; Get-Content serve-out.log -ErrorAction SilentlyContinue
              Write-Host '--- stderr ---'; Get-Content serve-err.log -ErrorAction SilentlyContinue
              if ($proc.HasExited) {
                throw "dcs-serve.exe exited with code $($proc.ExitCode) without serving — the frozen script never called main()."
              }
              throw 'dcs-serve.exe did not listen on both 127.0.0.1:7777 (DCS) and 8080 (HTTP) within 30s.'
            }
            Write-Host 'OK: dcs-serve.exe is listening on 127.0.0.1:7777 and 8080'
          }
          finally {
            # A one-file PyInstaller exe is a bootloader that re-launches itself as a
            # child process, and that child owns the sockets. Killing only the PID that
            # Start-Process returned orphans it, leaving 7777/8080 bound — hence /T.
            if (-not $proc.HasExited) { taskkill /F /T /PID $proc.Id 2>&1 | Out-String | Write-Host }
            # Generated at runtime — the api_key file must not linger on the runner.
            Remove-Item dcs-serve.yaml, serve-out.log, serve-err.log -ErrorAction SilentlyContinue
          }

      - name: Smoke-test dcs-client.exe (must expose its CLI)
        shell: pwsh
        run: |
          # A frozen script with no main() guard prints nothing and exits 0.
          $output = & dist\dcs-client.exe --help 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch 'tui' -or $output -notmatch 'web' -or $output -notmatch 'mcp') {
            throw 'dcs-client.exe --help printed no command list — main() was never invoked.'
          }
          Write-Host 'OK: dcs-client.exe exposes its CLI'

      - name: Create release archive
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist\release | Out-Null
          Copy-Item dist\dcs-serve.exe dist\release\
          Copy-Item dist\dcs-client.exe dist\release\
          Copy-Item src\lua\dcs-bridge.lua dist\release\
          Compress-Archive -Path dist\release\* -DestinationPath dist\dcs-bridge-$version.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: dcs-bridge v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/dcs-bridge-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move published-latest tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag -f published-latest "$TAG"
          git push origin -f published-latest
