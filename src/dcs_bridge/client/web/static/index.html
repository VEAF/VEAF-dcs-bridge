<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DCS Bridge — Map</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; }
    #status {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      padding: 4px 10px;
      border-radius: 4px;
      font-family: sans-serif;
      font-size: 13px;
      font-weight: bold;
      background: #333;
      color: #fff;
    }
    #status.connected { background: #27ae60; }
    #status.disconnected { background: #c0392b; }
    #catalog {
      position: absolute;
      top: 46px;
      right: 10px;
      z-index: 1000;
      max-width: 260px;
      max-height: 60%;
      overflow-y: auto;
      padding: 8px 12px;
      border-radius: 4px;
      font-family: sans-serif;
      font-size: 12px;
      background: rgba(51, 51, 51, 0.92);
      color: #fff;
    }
    #catalog h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; opacity: .8; }
    #catalog ul { list-style: none; }
    #catalog li { padding: 3px 0; border-top: 1px solid rgba(255,255,255,.12); }
    #catalog .verb { font-weight: bold; }
    #catalog .backends { opacity: .7; }
    #catalog .empty { opacity: .7; font-style: italic; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status" class="disconnected">Disconnected</div>
  <div id="catalog"><h2>Actions</h2><div class="empty">Loading…</div></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script>
    // --- Serve connection parameters.
    // Resolved at startup from GET /config.json (served by `dcs-client web`).
    // No credential is ever sent to the browser: the WebSocket is opened with an
    // ephemeral single-use ticket fetched from the web server's /ws-ticket proxy
    // (ADR-0005). The URL hash (#host=…&port=…) may override host/port only.
    let SERVE_HOST = '127.0.0.1';
    let SERVE_PORT = '8080';

    async function loadConfig() {
      try {
        const resp = await fetch('config.json', { cache: 'no-store' });
        if (resp.ok) {
          const cfg = await resp.json();
          if (cfg.host) SERVE_HOST = String(cfg.host);
          if (cfg.port) SERVE_PORT = String(cfg.port);
        }
      } catch (e) {
        // No /config.json (e.g. static hosting) — fall back to hash/defaults.
      }
      const params = new URLSearchParams(window.location.hash.slice(1));
      if (params.get('host')) SERVE_HOST = params.get('host');
      if (params.get('port')) SERVE_PORT = params.get('port');
    }

    // Fetch a fresh single-use WebSocket ticket from the web server proxy.
    async function fetchTicket() {
      const resp = await fetch('ws-ticket', { method: 'POST', cache: 'no-store' });
      if (!resp.ok) throw new Error(`ws-ticket failed: ${resp.status}`);
      const data = await resp.json();
      if (!data.ticket) throw new Error('ws-ticket response missing ticket');
      return data.ticket;
    }

    // --- Map
    const map = L.map('map').setView([0, 0], 3);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(map);

    // --- Coalition colours
    const COALITION_COLOR = { 0: '#888888', 1: '#c0392b', 2: '#2980b9' };
    const CATEGORY_RADIUS = { plane: 8, helicopter: 7, ship: 6, vehicle: 5 };

    // --- Marker registry
    const markers = {};

    function markerRadius(category) {
      return CATEGORY_RADIUS[category] || 5;
    }

    function upsertMarker(unit) {
      const { name, type, category, coalition, altitude_agl, position_geo } = unit;
      const latlng = [position_geo.lat, position_geo.lon];
      const color  = COALITION_COLOR[coalition] || '#888888';
      const radius = markerRadius(category);
      const tooltip = `<b>${name}</b><br>${type}<br>Alt: ${altitude_agl.toFixed(0)} m AGL`;

      if (markers[name]) {
        const m = markers[name];
        m.setLatLng(latlng);
        m.setStyle({ color, fillColor: color });
        m.setPopupContent(tooltip);
      } else {
        const m = L.circleMarker(latlng, {
          radius,
          color,
          fillColor: color,
          fillOpacity: 0.85,
          weight: 1.5,
        }).addTo(map);

        let pinned = false;
        m.bindPopup(tooltip);
        m.on('mouseover', () => { if (!pinned) m.openPopup(); });
        m.on('mouseout',  () => { if (!pinned) m.closePopup(); });
        m.on('click',     () => { pinned = !pinned; pinned ? m.openPopup() : m.closePopup(); });
        m.on('popupclose', () => { pinned = false; });

        markers[name] = m;
      }
    }

    function removeMarker(name) {
      if (markers[name]) {
        markers[name].remove();
        delete markers[name];
      }
    }

    function clearMarkers() {
      Object.keys(markers).forEach(removeMarker);
    }

    // --- Status badge
    const statusEl = document.getElementById('status');
    function setStatus(connected) {
      statusEl.textContent    = connected ? 'Connected' : 'Disconnected';
      statusEl.className      = connected ? 'connected' : 'disconnected';
    }

    // --- WebSocket
    async function connect() {
      let ticket;
      try {
        ticket = await fetchTicket();
      } catch (e) {
        setStatus(false);
        setTimeout(connect, 5000);
        return;
      }
      const wsScheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
      const url = `${wsScheme}://${SERVE_HOST}:${SERVE_PORT}/ws/stream?ticket=${encodeURIComponent(ticket)}`;
      const ws  = new WebSocket(url);

      ws.onopen = () => setStatus(true);

      ws.onmessage = (event) => {
        let msg;
        try { msg = JSON.parse(event.data); } catch { return; }

        if (msg.type === 'full_refresh') {
          clearMarkers();
          (msg.units || []).forEach(upsertMarker);
          // Fit map to all markers on first refresh if map is still at default view
          const bounds = Object.values(markers).map(m => m.getLatLng());
          if (bounds.length > 0 && map.getZoom() === 3) {
            map.fitBounds(L.latLngBounds(bounds), { padding: [40, 40] });
          }
        } else if (msg.type === 'unit_position' || msg.type === 'unit_spawned') {
          if (msg.data) upsertMarker(msg.data);
        } else if (msg.type === 'unit_destroyed') {
          if (msg.data && msg.data.name) removeMarker(msg.data.name);
        }
      };

      ws.onclose = () => {
        setStatus(false);
        setTimeout(connect, 5000);
      };

      ws.onerror = () => ws.close();
    }

    // --- Catalogue panel (capability-filtered actions for the running mission)
    const catalogEl = document.getElementById('catalog');
    async function loadCatalog() {
      try {
        const resp = await fetch('catalog', { cache: 'no-store' });
        if (!resp.ok) throw new Error(`catalog ${resp.status}`);
        const data = await resp.json();
        const actions = data.actions || [];
        if (actions.length === 0) {
          catalogEl.innerHTML = '<h2>Actions</h2><div class="empty">None available</div>';
          return;
        }
        const items = actions.map(a =>
          `<li><span class="verb">${a.name}</span> `
          + `<span class="backends">(${(a.available_backends || []).join(', ')})</span>`
          + `<br>${a.summary || ''}</li>`
        ).join('');
        catalogEl.innerHTML = `<h2>Actions</h2><ul>${items}</ul>`;
      } catch (e) {
        catalogEl.innerHTML = '<h2>Actions</h2><div class="empty">Unavailable</div>';
      }
    }

    loadConfig().then(connect);
    loadCatalog();
    setInterval(loadCatalog, 15000);  // refresh as mission capabilities change
  </script>
</body>
</html>
