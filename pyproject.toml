[tool.poetry]
name = "dcs-bridge"
version = "0.3.0"
description = "Generic bridge between DCS World and external consumers (TUI, WebUI, AI agents)"
authors = ["VEAF <https://www.veaf.org>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/VEAF/dcs-bridge"
repository = "https://github.com/VEAF/dcs-bridge"
package-mode = true
packages = [
    {include = "dcs_bridge", from = "src"},
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115,<1"
uvicorn = {extras = ["standard"], version = ">=0.30,<1"}
websockets = ">=13.0,<15"
pydantic = ">=2.0,<3"
pyyaml = ">=6.0,<7"
typer = ">=0.12,<1"
textual = ">=0.80,<1"
mcp = ">=1.0,<2"
httpx = "^0.28.1"

[tool.poetry.scripts]
dcs-serve = "dcs_bridge.serve.app:main"
dcs-client = "dcs_bridge.client.app:main"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.4"
mypy = ">=1.8"
pytest = ">=8.0"
pytest-cov = ">=5.0"
pytest-asyncio = ">=0.23"
httpx = ">=0.27"
types-PyYAML = ">=6.0"

[tool.poetry.group.build.dependencies]
pyinstaller = {version = ">=6.0", python = "<3.15"}

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# Mypy — type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src/dcs_bridge"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
addopts = [
    "--tb=short",
    "-q",
    "--import-mode=importlib",
    "--cov=src/dcs_bridge",
    "--cov-report=xml",
    "--cov-report=term-missing:skip-covered",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/dcs_bridge"]
omit = ["*/test_*.py", "*/*_test.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
